id: hardcoded-paths
language: nextflow
message: Avoid hardcoded absolute paths, use params or projectDir variables
severity: warning
note: |
  Instead of hardcoding paths like "/data/file.txt",
  use: params.input_file or file("${projectDir}/data/file.txt")
rule:
  any:
    - pattern: path($PATH)
    - pattern: file($PATH)
constraints:
  PATH:
    kind: string
    regex: ^["']/
