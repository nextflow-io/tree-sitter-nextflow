# AST-Grep Configuration for Nextflow
# https://ast-grep.github.io/advanced/custom-language.html

ruleDirs:
  - rules

customLanguages:
  nextflow:
    # Compiled parser libraries. scripts/install-ast-grep.sh downloads the
    # one for your platform from the GitHub release into lib/.
    libraryPath:
      aarch64-apple-darwin: lib/macos-arm64/libnextflow.dylib
      x86_64-apple-darwin: lib/macos-x64/libnextflow.dylib
      x86_64-unknown-linux-gnu: lib/linux-x64/libnextflow.so
      aarch64-unknown-linux-gnu: lib/linux-arm64/libnextflow.so

    # File extensions for Nextflow files
    extensions: [nf, config]

    # expandoChar lets the parser tokenize patterns even though Nextflow uses
    # $ for string interpolation: ast-grep maps $ <-> _ internally. Write
    # metavariables as the usual $VAR / $$$ in patterns and rules (NOT _VAR).
    expandoChar: _
